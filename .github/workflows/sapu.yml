# Sapuan penuh (`perkakas/sapu_penuh.sh`): konformans, contoh, modul std, contoh di situs, pemasang, mesin Praktik
# (wasm), jendela di Xvfb, JRG IDE di chromium. Dijalankan MANUAL (`gh workflow run sapu.yml`) sekali per gelombang
# kerja — ia menggandakan menit kalau ikut tiap dorongan. Uji APK sengaja dilewati di sini (SDK dikosongkan).

name: sapu

on:
  workflow_dispatch:

jobs:
  sapu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          # security.ubuntu.com kadang tak bisa di-resolve dari runner (2026-11-11, tiga kali berturut): pocket
          # -security juga ada di archive.ubuntu.com.
          sudo sed -i 's#security.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq xvfb imagemagick python3-pil > /dev/null

      - uses: Swatinem/rust-cache@v2

      - name: Bangun jrgc, runtime, jembatan, Praktik
        run: |
          cargo build --release -j 2
          (cd runtime && cargo build --release)
          (cd jembatan && cargo build --release)
          JOBS=2 sh perkakas/bangun_praktik.sh

      - name: Sapuan
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: |
          set +e
          sh perkakas/sapu_penuh.sh > sapu.log 2>&1
          rc=$?
          tail -40 sapu.log
          grep -A3 "== tes std/ lewat --uji" sapu.log || echo "bab tes std/ lewat --uji tidak ditemukan"
          exit $rc
        shell: bash

      - name: Simpan log sapuan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapu-log
          path: sapu.log
